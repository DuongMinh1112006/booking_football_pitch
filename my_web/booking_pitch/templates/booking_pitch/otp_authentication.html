<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác thực OTP</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .otp-container {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 420px;
            border-top: 5px solid #28a745;
            text-align: center;
        }

        h2 {
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 24px;
        }

        .description {
            color: #6c757d;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px;
            border: 1px solid #ced4da;
            border-radius: 8px;
            font-size: 18px;
            text-align: center;
            letter-spacing: 4px;
            font-weight: bold;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="text"]:focus {
            border-color: #28a745;
            outline: none;
            box-shadow: 0 0 0 3px rgba(40, 167, 69, 0.15);
        }

        button[type="submit"] {
            width: 100%;
            background-color: #28a745;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        button[type="submit"]:hover {
            background-color: #218838;
        }

        .error-message {
            color: #dc3545;
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            background-color: #f8d7da;
            padding: 10px;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <div class="otp-container">
        <h2>Xác thực OTP</h2>
        <p class="description">Vui lòng nhập mã OTP gồm 6 chữ số đã được gửi đến bạn.</p>

        {% if error %}
            <div class="error-message">{{ error }}</div>
        {% endif %}

        <form method="post" action="{% url 'otp_authentication' %}">
            {% csrf_token %}
            <input type="hidden" name="username" value="{{ username }}">

            <div class="form-group">
                <input type="text" name="otp" maxlength="6" placeholder="______" required autocomplete="off">
            </div>

            <button type="submit">Xác thực</button>
        </form>
    </div>

</body>
</html>
