<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký Đặt Sân</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .register-container {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 420px;
            border-top: 5px solid #28a745;
        }

        h2 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 24px;
            font-size: 24px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #495057;
            font-weight: 600;
            font-size: 14px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ced4da;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #28a745;
            outline: none;
            box-shadow: 0 0 0 3px rgba(40, 167, 69, 0.15);
        }

        button[type="submit"] {
            width: 100%;
            background-color: #28a745;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        button[type="submit"]:hover {
            background-color: #218838;
        }

        .error-message {
            color: #dc3545;
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            background-color: #f8d7da;
            padding: 10px;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <div class="register-container">
        <h2>Đăng ký tài khoản mới</h2>

        <form method="POST" action="">
            {% csrf_token %}

            <div class="form-group">
                <label>Tên đăng nhập:</label>
                <input type="text" name="username" required placeholder="Nhập tên đăng nhập">
            </div>

            <div class="form-group">
                <label>Họ và tên:</label>
                <input type="text" name="name" required placeholder="Nhập họ và tên của bạn">
            </div>

            <div class="form-group">
                <label>Mật khẩu:</label>
                <input type="password" name="password" required placeholder="Nhập mật khẩu">
            </div>

            <div class="form-group">
                <label>Gmail (bắt buộc):</label>
                <input type="text" name="gmail" required placeholder="example@gmail.com">
            </div>

            <div class="form-group">
                <label>Số điện thoại (tùy chọn):</label>
                <input type="text" name="phone_number" placeholder="Nhập số điện thoại">
            </div>

            <button type="submit">Đăng ký</button>
        </form>

        {% if error %}
            <div class="error-message">{{ error }}</div>
        {% endif %}
    </div>

</body>
</html>
