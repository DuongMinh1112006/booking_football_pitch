name: CI Check

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Lấy code về
        uses: actions/checkout@v4

      - name: Cài đặt Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Cài thư viện
        run: pip install -r my_web/requirements.txt

      - name: Chạy kiểm tra / Test
        env:
          DEBUG: "True"
          SECRET_KEY: "ci-test-key"
        run: |
          python my_web/manage.py check
